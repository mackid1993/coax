# coax behind a VPN using Gluetun (https://github.com/qdm12/gluetun, MIT license).
# All of coax's traffic, including provider logins, playlists and streams, goes through the tunnel.
# Gluetun setup guide: https://github.com/qdm12/gluetun-wiki
#
# Gluetun is configured entirely with environment variables; it builds the tunnel itself. No config files.
# Two examples below; use ONE of them and delete or comment out the other:
#   A. WireGuard (active): Gluetun's custom WireGuard provider, works with any WireGuard VPN.
#      https://github.com/qdm12/gluetun-wiki/blob/main/setup/providers/custom.md
#   B. OpenVPN (commented): a built-in provider with your VPN username and password.
# Every built-in provider (Mullvad, ProtonVPN, Windscribe, PIA, NordVPN, ...) lists its exact variables here:
#   https://github.com/qdm12/gluetun-wiki/tree/main/setup/providers
#
# 1. Create .env next to this file and keep it private (chmod 600 .env):
#      WireGuard: WG_ENDPOINT_IP, WG_ENDPOINT_PORT, WG_PUBLIC_KEY, WG_PRIVATE_KEY, WG_ADDRESSES
#                 (and WG_PRESHARED_KEY if your provider uses one)
#      OpenVPN:   VPN_PROVIDER, OPENVPN_USER, OPENVPN_PASSWORD, SERVER_COUNTRIES
# 2. Set FIREWALL_OUTBOUND_SUBNETS below to your LAN so coax can still reach Channels DVR.
#    Without it, Gluetun's firewall blocks all LAN traffic that is not a reply.
# 3. docker compose -f docker-compose.vpn.yml up -d
#    then open http://<this-host>:7780
services:
  gluetun:
    # Not pinned on purpose: Gluetun is your VPN and firewall, so take its security fixes.
    image: qmcgaw/gluetun:latest
    container_name: coax-gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      # ---- A. WireGuard (custom provider) ----
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard
      - WIREGUARD_ENDPOINT_IP=${WG_ENDPOINT_IP}
      - WIREGUARD_ENDPOINT_PORT=${WG_ENDPOINT_PORT}
      - WIREGUARD_PUBLIC_KEY=${WG_PUBLIC_KEY}
      - WIREGUARD_PRIVATE_KEY=${WG_PRIVATE_KEY}
      - WIREGUARD_PRESHARED_KEY=${WG_PRESHARED_KEY:-}
      - WIREGUARD_ADDRESSES=${WG_ADDRESSES}
      # ---- B. OpenVPN (built-in provider) ----
      # Comment out block A, then uncomment these. VPN_PROVIDER is the provider's name as written on its
      # Gluetun wiki page (for example windscribe, mullvad, protonvpn, private internet access).
      # - VPN_SERVICE_PROVIDER=${VPN_PROVIDER}
      # - VPN_TYPE=openvpn
      # - OPENVPN_USER=${OPENVPN_USER}
      # - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      # - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      # Your LAN, comma separated, e.g. 192.168.1.0/24. Lets coax reach Channels DVR outside the tunnel.
      # Must not overlap the VPN's own address range.
      - FIREWALL_OUTBOUND_SUBNETS=192.168.1.0/24
      # Your timezone, for Gluetun's log timestamps.
      - TZ=Etc/UTC
    ports:
      # coax shares Gluetun's network, so coax's port is published here, not on the coax service.
      - "7780:7780"

  coax:
    # :latest is the newest release. To freeze a version, use its number instead (e.g. :1.0.0).
    image: ghcr.io/mackid1993/coax:latest
    container_name: coax
    restart: unless-stopped
    # All traffic goes through Gluetun. No ports: here; they are on the gluetun service.
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    volumes:
      - ./data:/data

    # ---- Optional: hardware transcoding (only needed if you turn on Transcode in Settings) ----
    #
    # Intel or AMD graphics (VAAPI). Uncomment devices. coax adds the group that owns /dev/dri/renderD128
    # on its own; group_add is only needed if transcoding still falls back to the CPU. Find the GID on the
    # host with:  stat -c %g /dev/dri/renderD128
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "105"   # GID from the stat command above (example)
    #
    # NVIDIA (NVENC). Needs the NVIDIA driver and NVIDIA Container Toolkit on the host. Uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu, video, compute, utility]
