# coax behind a WireGuard VPN using Gluetun (https://github.com/qdm12/gluetun, MIT license).
# All of coax's traffic, including provider streams, goes through the tunnel.
#
# 1. Put your provider's WireGuard config at ./data/wireguard/wg0.conf
#    (the Endpoint must be an IP address, not a hostname).
# 2. Set FIREWALL_OUTBOUND_SUBNETS below to your LAN so coax can still reach
#    Channels DVR. Without it, Gluetun's firewall blocks LAN traffic.
# 3. docker compose -f docker-compose.vpn.yml up -d
#    then open http://<this-host>:7780
services:
  gluetun:
    # Gluetun v3.41.3, pinned by digest (multi-arch index), resolved 2026-10-27.
    image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    container_name: coax-gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard
      # Your LAN, comma separated, e.g. 192.168.1.0/24. Must not overlap the VPN's own range.
      - FIREWALL_OUTBOUND_SUBNETS=192.168.1.0/24
      # Your timezone, for Gluetun's log timestamps.
      - TZ=Etc/UTC
    volumes:
      - ./data/wireguard/wg0.conf:/gluetun/wireguard/wg0.conf:ro
    ports:
      # coax shares Gluetun's network, so its port is published here.
      - "7780:7780"

  coax:
    # Pin a released version. ghcr.io/mackid1993/coax:main is for testing only.
    image: ghcr.io/mackid1993/coax:1.0.0
    container_name: coax
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    volumes:
      - ./data:/data
    # Optional GPU, same as docker-compose.yml:
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "105"   # render GID on the host (example)
    #   - "44"    # video GID on the host (example)
