# coax, standalone.
# Start: docker compose up -d   then open http://<this-host>:7780
# ./data is created on first start; coax fixes its ownership itself.
# Pin a released version. To try the newest development build, use
# ghcr.io/mackid1993/coax:main instead (testing only, it changes without notice).
services:
  coax:
    # :latest is the newest release. To freeze a version, use its number instead (e.g. :1.0.0).
    image: ghcr.io/mackid1993/coax:latest
    labels:
      # Icon for Unraid Compose Manager and other dashboards that read it.
      net.unraid.docker.icon: https://raw.githubusercontent.com/mackid1993/coax/main/assets/brand/coax-icon-256.png
    container_name: coax
    restart: unless-stopped
    ports:
      - "7780:7780"
    volumes:
      - ./data:/data

    # ---- Optional: hardware transcoding (only needed if you turn on Transcode in Settings) ----
    #
    # Intel or AMD graphics (VAAPI). Uncomment devices. coax adds the group that owns /dev/dri/renderD128
    # on its own; group_add is only needed if transcoding still falls back to the CPU. Find the GID on the
    # host with:  stat -c %g /dev/dri/renderD128
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "105"   # GID from the stat command above (example)
    #
    # NVIDIA (NVENC). Needs the NVIDIA driver and NVIDIA Container Toolkit on the host. Uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu, video, compute, utility]
